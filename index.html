<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bob's Business Card</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f5;
      margin: 0;
      padding: 0;
      text-align: center;
      color: #333;
    }

    header {
      padding: 40px;
      font-size: 2.5em;
      background-color: #4caf50;
      color: white;
    }

    nav {
      margin: 30px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    nav a {
      margin: 12px 0;
      font-size: 1.4em;
      text-decoration: none;
      background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transition: transform 0.3s ease;
    }

    nav a:hover {
      transform: scale(1.1);
    }

    footer {
      background-color: #333;
      color: white;
      padding: 20px 0;
    }

    .icons {
      margin: 10px;
    }

    .icons img {
      width: 24px;
      height: 24px;
      margin: 0 8px;
      vertical-align: middle;
    }
  </style>
</head>
<body>

  <header>Bob</header>

  <nav>
    <a href="#photography">Photography</a>
    <a href="#yard-work">Yard Work</a>
    <a href="#metaverse-blog">Metaverse Blog</a>
  </nav>

  <footer>
    <div class="icons">
      <img src="https://img.icons8.com/ios-filled/50/email.png" alt="Email">
    </div>
    <p>&copy; 2025 Bob. All rights reserved.</p>
  </footer>

</body>
</html>
